[package]
name = "cryptc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
daemonize = "0.5.0"
fuser = { version = "0.18.0", features = ["libfuse3"] }
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["backup", "sqlcipher"] }
