name: Tests

# The unit tests plus tests/integration.sh - a real FUSE mount on the
# runner itself, exercised end to end (write, read, rename, sparse files,
# rsync round-trips, remount, read-only, idle unmount, a hard kill of the
# mount daemon mid-write, passwd, compact, the registry). The runner's
# kernel has FUSE and the fuse3 package provides fusermount3; nothing
# needs root beyond the apt install.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 rsync perl attr python3 >/dev/null

      # The newest tagged release, installed as the "previous version" for
      # the suite's cross-version section: containers must keep opening in
      # both directions. The runner is Ubuntu 24.04, hence that package.
      - name: Install the previous release for the compatibility checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'coffer_*_ubuntu2404_amd64.deb' --dir /tmp/prev
          sudo apt-get install -y -qq /tmp/prev/coffer_*.deb >/dev/null
          /usr/bin/coffer --version

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      - name: Integration suite
        run: COFFER_PREV=/usr/bin/coffer tests/integration.sh
