name: Tests

# The unit tests plus tests/integration.sh - a real FUSE mount on the
# runner itself, exercised end to end (write, read, rename, sparse files,
# rsync round-trips, remount, read-only, idle unmount, a hard kill of the
# mount daemon mid-write, passwd, compact, the registry). The runner's
# kernel has FUSE and the fuse3 package provides fusermount3; nothing
# needs root beyond the apt install.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 rsync perl attr python3 >/dev/null

      # v0.1.2, the last release without the xattrs table, installed as the
      # "previous version" for the suite's cross-version section: containers
      # must keep opening in both directions, and the additive-table path
      # (an old container written by this version, then opened by the old
      # one again) must actually be exercised - which is why this is pinned
      # rather than "newest release": once a newer release has the table
      # itself, those checks would silently stop testing what they claim.
      # The runner is Ubuntu 24.04, hence that package. Only in the upstream
      # repository: a fork has no releases to download.
      - name: Install v0.1.2 for the compatibility checks
        if: github.repository == 'rtulke/cofferFS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.2 --repo "$GITHUB_REPOSITORY" \
            --pattern 'coffer_0.1.2-1_ubuntu2404_amd64.deb' --dir /tmp/prev
          sudo apt-get install -y -qq /tmp/prev/coffer_*.deb >/dev/null
          /usr/bin/coffer --version
          echo "COFFER_PREV=/usr/bin/coffer" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

      # Without a previous release to compare against, the suite's
      # cross-version section would silently not run - it fails instead,
      # unless told that there is nothing to compare with (a fork, where
      # the step above is skipped).
      - name: Integration suite
        env:
          COFFER_PREV_OPTIONAL: ${{ github.repository == 'rtulke/cofferFS' && '' || '1' }}
        run: tests/integration.sh
