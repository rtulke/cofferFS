name: Release

# build+verify run on every push/PR to main so packaging breakage is caught
# early; the release job only fires on an actual "vX.Y.Z" tag push.
#
# Two package families, each built natively per target distro AND per
# architecture (see the comments on the build jobs for why there's no
# single universal package):
#   .deb  - Debian 12/13, Ubuntu 24.04/26.04           (build / verify)
#   .rpm  - Fedora 43/44, EL9/EL10, openSUSE Leap 16.0 and Tumbleweed
#                                                      (build-rpm / verify-rpm)
# each for amd64 (x86_64) and arm64 (aarch64). The arm64 builds run on
# GitHub's hosted ARM runners inside the arm64 variants of the very same
# multi-arch container images, so nothing is cross-compiled or emulated;
# the Debian arm64 packages are what Raspberry Pi OS (64-bit) installs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_DEB_VERSION: "3.7.0"
  CARGO_GENERATE_RPM_VERSION: "0.21.0"

jobs:
  build:
    strategy:
      fail-fast: false
      # id x arch is the real matrix; the include entries only attach the
      # image to each id and the runner to each arch (an include object
      # that matches an existing key is merged into every combination with
      # that value, it does not add a new one).
      matrix:
        id: [debian12, debian13, ubuntu2404, ubuntu2604]
        arch: [amd64, arm64]
        include:
          - { id: debian12,   image: debian:12-slim }
          - { id: debian13,   image: debian:13-slim }
          - { id: ubuntu2404, image: ubuntu:24.04 }
          - { id: ubuntu2604, image: ubuntu:26.04 }
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      # actions/checkout shells out to git, which isn't present in the bare
      # distro images used as build containers - install it (and everything
      # the Rust build itself needs) before checking out.
      - name: Install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git build-essential perl curl ca-certificates

      - uses: actions/checkout@v7

      # rustup's toolchain, not the distro's apt rustc/cargo (1.63-1.75
      # depending on release - too old for several dependencies, which need
      # the 2024 edition). See README.md.
      - name: Install Rust
        run: |
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # One .deb per distro, built natively in that distro's own container.
      # No libfuse development package: fuser's pure-Rust mount links no
      # libfuse (see Cargo.toml), and SQLCipher/OpenSSL are statically
      # bundled, so the only runtime dependencies are the C library and the
      # fusermount3 helper from the fuse3 package. Building per distro is
      # kept anyway so each package is verified on exactly the distro it is
      # for and declares that distro's own glibc version - see REFERENCE.md.
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version "$CARGO_DEB_VERSION"

      - name: Build man page
        run: make man

      - name: Build release binary
        run: cargo build --release

      - name: Build shell completions
        run: make completions

      - name: Build .deb
        run: cargo deb

      # cargo-deb names the file after the Debian architecture it was built
      # on (_amd64 / _arm64); the distro id is slotted in before that.
      - name: Rename package with distro id
        run: |
          SRC=$(ls target/debian/*.deb | head -1)
          DST="target/debian/$(basename "$SRC" | sed -E "s/_([a-z0-9]+)\.deb$/_${{ matrix.id }}_\1.deb/")"
          mv "$SRC" "$DST"
          echo "DEB_PATH=$DST" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.id }}-${{ matrix.arch }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

  build-rpm:
    strategy:
      fail-fast: false
      matrix:
        id: [fedora43, fedora44, el9, el10, leap160, tumbleweed]
        arch: [amd64, arm64]
        include:
          - { id: fedora43, image: fedora:43, family: dnf }
          - { id: fedora44, image: fedora:44, family: dnf }
          # AlmaLinux stands in for the whole EL family (RHEL, Rocky, Alma,
          # Oracle) - binary-compatible, and unlike rockylinux its official
          # Docker Hub images cover both 9 and 10.
          - { id: el9,  image: almalinux:9,  family: dnf }
          - { id: el10, image: almalinux:10, family: dnf }
          - { id: leap160, image: opensuse/leap:16.0, family: zypper }
          # Rolling release: a package built today matches today's
          # Tumbleweed. The rolling "latest" prerelease (rebuilt on every
          # push to main) is the one Tumbleweed users should grab.
          - { id: tumbleweed, image: opensuse/tumbleweed, family: zypper }
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      # Same story as the .deb build: git first, for actions/checkout. rpm-build
      # so cargo-generate-rpm's default auto-req finds the distro's own
      # /usr/lib/rpm/find-requires and emits exactly the versioned Requires:
      # that distro's packages carry, instead of its ldd-based fallback.
      # No fuse3-devel: nothing links libfuse (see Cargo.toml).
      # --allowerasing: the EL images ship curl-minimal, which conflicts
      # with the full curl package and makes a plain `dnf install curl`
      # fail outright ("problem with installed package curl-minimal").
      - name: Install build prerequisites
        run: |
          if [ "${{ matrix.family }}" = zypper ]; then
            zypper --non-interactive --gpg-auto-import-keys refresh
            zypper --non-interactive install --no-recommends \
              gcc make perl rpm-build git curl ca-certificates tar gzip
          else
            dnf install -y --allowerasing --setopt=install_weak_deps=False \
              gcc make perl rpm-build git curl ca-certificates tar gzip
          fi

      - uses: actions/checkout@v7

      # The openSUSE images set no PATH in their image config, and the runner
      # builds a container step's PATH from that config plus $GITHUB_PATH -
      # so adding only ~/.cargo/bin there leaves later steps with a PATH of
      # exactly that one directory and `sh: executable file not found`.
      # Prepending to the full PATH the shell actually has right now keeps
      # the system directories in place on every image.
      - name: Install Rust
        run: |
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

      # One .rpm per distro, natively, same reasoning as the .deb side: each
      # package's auto-discovered Requires: simply names whatever that
      # distro actually ships, and each is verified on exactly that distro.
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked --version "$CARGO_GENERATE_RPM_VERSION"

      - name: Build man page
        run: make man

      - name: Build release binary
        run: cargo build --release

      - name: Build shell completions
        run: make completions

      # The distro id goes into the Release field, so the file names follow
      # the same spelled-out scheme as the .deb side
      # (coffer-0.1.0-1.fedora44.x86_64.rpm next to
      # coffer_0.1.0-1_debian12_amd64.deb) - with no rename step needed,
      # since RPM naming puts the Release field and the RPM architecture
      # (x86_64 / aarch64) into the file name itself.
      - name: Build .rpm
        run: cargo generate-rpm --set-metadata 'release = "1.${{ matrix.id }}"'

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.id }}-${{ matrix.arch }}
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        id: [debian12, debian13, ubuntu2404, ubuntu2604]
        arch: [amd64, arm64]
        include:
          - { id: debian12,   image: debian:12-slim }
          - { id: debian13,   image: debian:13-slim }
          - { id: ubuntu2404, image: ubuntu:24.04 }
          - { id: ubuntu2604, image: ubuntu:26.04 }
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.id }}-${{ matrix.arch }}

      # Run the test distro as a plain `docker run` step rather than a job-
      # level `container:`, so every flag docker actually gets is explicit
      # and under our control (GitHub's job-container `options:` field is
      # murkier about what it forwards). Mounting FUSE here needs all four:
      # --device (else "device not found, try 'modprobe fuse' first"),
      # --cap-add SYS_ADMIN (else mount() itself is rejected), and BOTH
      # --security-opt seccomp=unconfined AND apparmor=unconfined - with
      # apparmor left at Docker's default `docker-default` profile, mount()
      # still failed with "Permission denied" even with the capability and
      # seccomp already unconfined (that profile denies `mount,` outright,
      # independent of capabilities/seccomp). Confirmed by hitting each of
      # these failures in turn on this exact job before adding the next flag.
      #
      # A real `apt-get install`, not `dpkg -i`, so declared Depends:
      # actually have to resolve against this distro's package archive -
      # that's the whole point of testing per-distro in the first place.
      # Full functional smoke test, not just "did dpkg accept it": create a
      # container, mount it, write and read a file back, unmount, and run
      # the integrity check - proves FUSE mounting and SQLCipher both
      # actually work in this distro's environment, not just that the
      # binary is present.
      - name: Install and smoke-test the package the same way an end user would
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN --device /dev/fuse \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/work:ro" \
            ${{ matrix.image }} \
            bash -euxc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /work/coffer_*.deb
              test -f /usr/share/bash-completion/completions/coffer
              coffer --version

              mkdir -p /root/mnt
              printf "testpass\ntestpass\n" | coffer create /root/vault.coffer
              printf "testpass\n" | coffer mount /root/vault.coffer /root/mnt --foreground &
              MOUNT_PID=$!
              sleep 1
              echo "hello from CI" > /root/mnt/f.txt
              grep -q "hello from CI" /root/mnt/f.txt
              fusermount3 -u /root/mnt
              wait "$MOUNT_PID" 2>/dev/null || true
              printf "testpass\n" | coffer check /root/vault.coffer
            '

  verify-rpm:
    needs: build-rpm
    strategy:
      fail-fast: false
      matrix:
        id: [fedora43, fedora44, el9, el10, leap160, tumbleweed]
        arch: [amd64, arm64]
        include:
          - { id: fedora43, image: fedora:43, family: dnf }
          - { id: fedora44, image: fedora:44, family: dnf }
          - { id: el9,  image: almalinux:9,  family: dnf }
          - { id: el10, image: almalinux:10, family: dnf }
          - { id: leap160,    image: opensuse/leap:16.0,  family: zypper }
          - { id: tumbleweed, image: opensuse/tumbleweed, family: zypper }
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rpm-${{ matrix.id }}-${{ matrix.arch }}

      # Same docker flags and the same functional cycle as the .deb verify
      # job above (see there for why each flag is needed). A real `dnf
      # install` / `zypper install` of the local file, so the auto-discovered
      # Requires: (glibc symbol versions) and the explicit
      # fuse3 dependency actually have to resolve against this distro's
      # repos. zypper additionally needs --allow-unsigned-rpm since the
      # packages aren't GPG-signed; dnf accepts unsigned local files as is.
      #
      # The man page is checked via the package manifest, not the
      # filesystem: Fedora/EL/openSUSE container images install with
      # tsflags=nodocs, so %doc files legitimately never land on disk there
      # even though the package correctly ships and declares them.
      - name: Install and smoke-test the package the same way an end user would
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN --device /dev/fuse \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/work:ro" \
            -e FAMILY=${{ matrix.family }} \
            ${{ matrix.image }} \
            bash -euxc '
              if [ "$FAMILY" = zypper ]; then
                zypper --non-interactive --gpg-auto-import-keys refresh
                zypper --non-interactive install --allow-unsigned-rpm /work/coffer-*.rpm
              else
                dnf install -y /work/coffer-*.rpm
              fi
              rpm -q coffer
              rpm -ql coffer | grep -qx /usr/share/man/man1/coffer.1.gz
              test -f /usr/share/bash-completion/completions/coffer
              coffer --version

              mkdir -p /root/mnt
              printf "testpass\ntestpass\n" | coffer create /root/vault.coffer
              printf "testpass\n" | coffer mount /root/vault.coffer /root/mnt --foreground &
              MOUNT_PID=$!
              sleep 1
              echo "hello from CI" > /root/mnt/f.txt
              grep -q "hello from CI" /root/mnt/f.txt
              fusermount3 -u /root/mnt
              wait "$MOUNT_PID" 2>/dev/null || true
              printf "testpass\n" | coffer check /root/vault.coffer
            '

  release:
    needs: [verify, verify-rpm]
    # Tag pushes (vX.Y.Z) publish a proper, stable release. Pushes to main
    # additionally republish a single rolling "latest" prerelease so a
    # built package is always available between tagged versions - see the
    # "Determine release identity" step for how the two are told apart.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release identity
        id: rel
        run: |
          PKGS="one .deb per Debian/Ubuntu target (12/13, 24.04/26.04) and one .rpm per Fedora (43/44), EL (9/10) and openSUSE (Leap 16.0, Tumbleweed) target, each for amd64 and arm64 (the Debian arm64 packages are the ones for Raspberry Pi OS 64-bit), see SHA256SUMS"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "notes=coffer $GITHUB_REF_NAME - $PKGS" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=coffer (main, rolling build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "notes=Rolling build of main@${GITHUB_SHA::7} - not a stable release, see the tagged vX.Y.Z releases for that. $PKGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.deb *.rpm > SHA256SUMS
          TAG="${{ steps.rel.outputs.tag }}"
          PRERELEASE_FLAG=""
          [[ "${{ steps.rel.outputs.prerelease }}" == "true" ]] && PRERELEASE_FLAG="--prerelease"
          # "latest" is a moving target: delete the previous release+tag first
          # so the tag actually advances to this commit instead of staying
          # pinned to whichever commit first created it. Tagged vX.Y.Z
          # releases are never deleted here - only re-uploaded via the
          # `gh release upload --clobber` fallback below on a re-run.
          if [[ "$TAG" == "latest" ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.rel.outputs.title }}" \
            --notes "${{ steps.rel.outputs.notes }}" \
            $PRERELEASE_FLAG \
            * \
          || gh release upload "$TAG" * \
            --repo "$GITHUB_REPOSITORY" --clobber
