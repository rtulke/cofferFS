[package]
# The crate is `cofferfs` because `coffer` was already taken on crates.io
# by an unrelated Java library. Everything a user sees keeps the short
# name: the binary via [[bin]] below, the .deb and .rpm via the `name`
# key in their metadata sections.
name = "cofferfs"
version = "0.1.3"
edition = "2021"
description = "Growable, user-mountable encrypted single-file containers (SQLCipher + FUSE)"
license = "MIT"
authors = ["Robert Tulke <rt@debian.sh>"]
repository = "https://github.com/rtulke/cofferFS"
# Repository decoration nobody building from crates.io needs: the demo
# animation and the social-preview card are a quarter of a megabyte of
# images, and the CI workflows only mean anything inside the repository.
exclude = ["docs/demo.gif", "docs/social-preview.png", ".github/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "coffer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.6"
# Default features on purpose: fuser's pure-Rust mount talks to the
# fusermount3 helper directly and links no libfuse at all. The earlier
# `libfuse3` feature dragged in a runtime dependency on libfuse3.so.3/.4
# (a different SONAME per distro generation) and printed a spurious
# "fuse: warning: library too old" on distros with libfuse < 3.17,
# because fuser hands fuse_session_new() an ops struct sized for 3.17.
fuser = "0.18.0"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
zeroize = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "coffer"
maintainer = "Robert Tulke <rt@debian.sh>"
copyright = "2026, Robert Tulke <rt@debian.sh>"
section = "utils"
priority = "optional"
depends = "$auto, fuse3"
extended-description = """\
coffer creates a single-file encrypted container that any user can create \
and mount without root or sudo. It's backed by SQLCipher (bundled, \
statically linked - no system libsqlcipher dependency) and mounted via \
FUSE. Containers grow automatically as data is written (no fixed size, no \
resize step), and are crash-safe via SQLite's WAL journal.
"""
assets = [
    ["target/release/coffer", "usr/bin/", "755"],
    ["target/man/coffer.1.gz", "usr/share/man/man1/coffer.1.gz", "644"],
    ["README.md", "usr/share/doc/coffer/README.md", "644"],
    ["REFERENCE.md", "usr/share/doc/coffer/REFERENCE.md", "644"],
    ["target/completions/coffer.bash", "usr/share/bash-completion/completions/coffer", "644"],
    ["target/completions/_coffer", "usr/share/zsh/site-functions/_coffer", "644"],
    ["target/completions/coffer.fish", "usr/share/fish/vendor_completions.d/coffer.fish", "644"],
]

# RPM counterpart of the cargo-deb block above, consumed by cargo-generate-rpm
# (packaging/build-rpm.sh and the release workflow). Same asset list; the
# distro id (.fedora44, .el9, .leap160, ...) is not set here but injected per
# build via `--set-metadata 'release = "1.<id>"'`, since one RPM is built
# natively per target distro - same libfuse3 SONAME reasoning as for the
# .deb packages, see packaging/build-deb.sh.
[package.metadata.generate-rpm]
name = "coffer"
assets = [
    { source = "target/release/coffer", dest = "/usr/bin/coffer", mode = "755" },
    { source = "target/man/coffer.1.gz", dest = "/usr/share/man/man1/coffer.1.gz", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/coffer/README.md", mode = "644", doc = true },
    { source = "REFERENCE.md", dest = "/usr/share/doc/coffer/REFERENCE.md", mode = "644", doc = true },
    { source = "target/completions/coffer.bash", dest = "/usr/share/bash-completion/completions/coffer", mode = "644" },
    { source = "target/completions/_coffer", dest = "/usr/share/zsh/site-functions/_coffer", mode = "644" },
    { source = "target/completions/coffer.fish", dest = "/usr/share/fish/vendor_completions.d/coffer.fish", mode = "644" },
]

[package.metadata.generate-rpm.requires]
# The fusermount3 helper that mount/umount shell out to. It lives in the
# `fuse3` package on Fedora, EL and openSUSE alike, separate from the
# libfuse3 shared library that automatic dependency discovery picks up on
# its own - `ldd` only sees the linked library, not the subprocess.
fuse3 = "*"
